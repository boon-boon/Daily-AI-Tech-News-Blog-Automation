<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Anthropic&#x27;s Claude Agent SDK brings MCP and sub-agents to TypeScript and Python">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.34"/>
    </linearGradient>
    <!-- Full-bleed dot texture: reads as intentional at every crop. -->
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.5" fill="#ffffff" fill-opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- The scrim keeps white type legible over light gradients too. -->
  <rect width="1200" height="630" fill="url(#scrim)"/>

  <text x="600" y="300" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="62" font-weight="700" fill="#ffffff" fill-opacity="0.97">TechPulse.</text>

  <rect x="560" y="336" width="80" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.55"/>

  <text x="600" y="384" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" letter-spacing="3" fill="#ffffff" fill-opacity="0.85">DEVELOPER TOOLS</text>
</svg>
